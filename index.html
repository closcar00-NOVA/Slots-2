<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian Fusion Vegas Slots</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-red: #ff003c;
            --neon-gold: #ffcf00;
            --bg-dark: #0a0a0a;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        /* Top Pots */
        .pots-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .pot {
            text-align: center;
            padding: 15px 30px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 10px var(--neon-red), inset 0 0 10px var(--neon-red);
            border: 1px solid var(--neon-red);
        }

        .pot h2 {
            margin: 0;
            font-weight: 100;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #fff;
        }

        .pot .amount {
            font-weight: 600;
            font-size: 1.5rem;
            color: var(--neon-gold);
            margin-top: 5px;
            text-shadow: 0 0 5px var(--neon-gold);
        }

        /* Slot Grid */
        .slot-machine {
            background-image: url('env_reel_backing.png.png');
            background-size: cover;
            background-position: center;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 15px var(--neon-gold), inset 0 0 20px var(--neon-gold);
            border: 2px solid var(--neon-gold);
            display: flex;
            gap: 10px;
        }

        .reel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .symbol-box {
            width: 100px;
            height: 100px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .symbol-img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            transition: transform 0.1s;
        }

        /* Coin Value Overlay */
        .coin-value {
            position: absolute;
            font-weight: 600;
            font-size: 1.4rem;
            color: var(--neon-gold);
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 10px var(--neon-gold);
            z-index: 10;
        }

        /* Controls */
        .controls {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 120px;
        }

        .stat-label {
            font-weight: 100;
            font-size: 0.9rem;
            color: #aaa;
            letter-spacing: 1px;
        }

        .stat-value {
            font-weight: 600;
            font-size: 1.5rem;
            color: #fff;
        }

        button {
            background: transparent;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 15px 30px;
            border: 1px solid var(--neon-red);
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 8px var(--neon-red) inset, 0 0 8px var(--neon-red);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover:not(:disabled) {
            background: rgba(255, 0, 60, 0.2);
            box-shadow: 0 0 15px var(--neon-red) inset, 0 0 15px var(--neon-red);
        }

        button:active:not(:disabled) {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            border-color: #555;
        }

        .spin-btn {
            border-color: var(--neon-gold);
            box-shadow: 0 0 10px var(--neon-gold) inset, 0 0 10px var(--neon-gold);
            font-size: 1.3rem;
            padding: 15px 50px;
        }

        .spin-btn:hover:not(:disabled) {
            background: rgba(255, 207, 0, 0.2);
            box-shadow: 0 0 20px var(--neon-gold) inset, 0 0 20px var(--neon-gold);
        }
        
        .spinning .symbol-img {
            animation: blurSpin 0.1s infinite;
        }

        @keyframes blurSpin {
            0% { transform: translateY(-50%) scaleY(1.5); opacity: 0.5; }
            100% { transform: translateY(50%) scaleY(1.5); opacity: 0.5; }
        }

    </style>
</head>
<body>

    <div class="pots-container">
        <div class="pot">
            <h2>GRAND</h2>
            <div class="amount" id="grand-pot">$5,000.00</div>
        </div>
        <div class="pot">
            <h2>MAJOR</h2>
            <div class="amount" id="major-pot">$1,000.00</div>
        </div>
        <div class="pot">
            <h2>MINOR</h2>
            <div class="amount" id="minor-pot">$250.00</div>
        </div>
    </div>

    <div class="slot-machine" id="grid">
        <!-- Grid generated by JS -->
    </div>

    <div class="controls">
        <div class="stat-box">
            <div class="stat-label">BANKROLL</div>
            <div class="stat-value" id="bankroll-display">$10,000.00</div>
        </div>
        
        <button id="raise-btn" onclick="raiseBid()">Raise Bid</button>
        
        <div class="stat-box">
            <div class="stat-label">CURRENT BET</div>
            <div class="stat-value" id="bet-display">$10.00</div>
        </div>

        <button id="max-bet-btn" onclick="maxBid()">Max Bid</button>
        <button class="spin-btn" id="spin-btn" onclick="spin()">SPIN</button>
    </div>

    <script>
        // Game State
        let bankroll = 10000;
        let currentBet = 10;
        const MAX_BET = 10000;
        const MIN_BET = 10;
        let isSpinning = false;

        // Assets mapping exact GitHub filenames
        const SYMBOLS = [
            'symbol_a.png.png',
            'symbol_k.png.png',
            'symbol_q.png.png',
            'symbol_j.png.png',
            'symbol_pepper.png.png',
            'symbol_sycee.png.png',
            'symbol_wild.png.png',
            'symbol_coin.png.png'
        ];

        // Format Currency
        const formatMoney = (amount) => {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
        };

        // Initialize Grid
        const gridEl = document.getElementById('grid');
        const cols = 5;
        const rows = 3;

        function initGrid() {
            gridEl.innerHTML = '';
            for (let c = 0; c < cols; c++) {
                const reel = document.createElement('div');
                reel.className = 'reel';
                reel.id = `reel-${c}`;
                
                for (let r = 0; r < rows; r++) {
                    const box = document.createElement('div');
                    box.className = 'symbol-box';
                    
                    const img = document.createElement('img');
                    img.className = 'symbol-img';
                    // Set default to Wild just for initial load look
                    img.src = 'symbol_wild.png.png';
                    img.onerror = function() { this.style.display = 'none'; }; // Hide if asset missing
                    
                    box.appendChild(img);
                    reel.appendChild(box);
                }
                gridEl.appendChild(reel);
            }
            updateDisplay();
        }

        // Controls
        function updateDisplay() {
            document.getElementById('bankroll-display').innerText = formatMoney(bankroll);
            document.getElementById('bet-display').innerText = formatMoney(currentBet);
        }

        function raiseBid() {
            if (isSpinning) return;
            if (currentBet < 100) currentBet += 10;
            else if (currentBet < 1000) currentBet += 100;
            else if (currentBet < MAX_BET) currentBet += 1000;
            else currentBet = MIN_BET;
            
            if (currentBet > bankroll) currentBet = bankroll;
            updateDisplay();
        }

        function maxBid() {
            if (isSpinning) return;
            currentBet = Math.min(MAX_BET, bankroll);
            updateDisplay();
        }

        // Spin Logic
        function spin() {
            if (isSpinning || currentBet > bankroll || bankroll <= 0) return;
            
            isSpinning = true;
            bankroll -= currentBet;
            updateDisplay();
            
            const btn = document.getElementById('spin-btn');
            btn.disabled = true;

            const reels = document.querySelectorAll('.reel');
            
            reels.forEach((reel, index) => {
                const boxes = reel.querySelectorAll('.symbol-box');
                
                // Add spin animation class
                boxes.forEach(box => {
                    box.classList.add('spinning');
                    // Clear previous coin values
                    const oldVal = box.querySelector('.coin-value');
                    if (oldVal) oldVal.remove();
                });

                // Stagger reel stops
                setTimeout(() => {
                    boxes.forEach(box => {
                        box.classList.remove('spinning');
                        
                        // Pick random symbol
                        const randomImg = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                        const imgEl = box.querySelector('.symbol-img');
                        imgEl.src = randomImg;
                        imgEl.style.display = 'block';

                        // If it's a coin, generate a random cash overlay
                        if (randomImg === 'symbol_coin.png.png') {
                            const valEl = document.createElement('div');
                            valEl.className = 'coin-value';
                            // Random value based on bet size
                            const multi = [0.5, 1, 2, 5, 10][Math.floor(Math.random() * 5)];
                            valEl.innerText = formatMoney(currentBet * multi);
                            box.appendChild(valEl);
                        }
                    });

                    // Re-enable button after last reel stops
                    if (index === reels.length - 1) {
                        isSpinning = false;
                        btn.disabled = false;
                        checkWin();
                    }
                }, 500 + (index * 300)); // 500ms base + 300ms per reel stagger
            });
        }

        function checkWin() {
            // For now, this just simulates returning some money randomly for testing
            if (Math.random() > 0.6) {
                const winAmt = currentBet * (Math.floor(Math.random() * 5) + 1);
                bankroll += winAmt;
                updateDisplay();
            }
        }

        // Run
        initGrid();

    </script>
</body>
</html>
