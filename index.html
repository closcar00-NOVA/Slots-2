<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian Fusion Vegas Slots</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-red: #ff003c;
            --neon-gold: #ffcf00;
            --neon-green: #00ff66;
            --bg-dark: #0a0a0a;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        /* Top Pots */
        .pots-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .pot {
            text-align: center;
            padding: 15px 30px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 10px var(--neon-red), inset 0 0 10px var(--neon-red);
            border: 1px solid var(--neon-red);
            transition: box-shadow 0.3s, transform 0.3s;
        }

        .pot h2 {
            margin: 0;
            font-weight: 100;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #fff;
        }

        .pot .amount {
            font-weight: 600;
            font-size: 1.5rem;
            color: var(--neon-gold);
            margin-top: 5px;
            text-shadow: 0 0 5px var(--neon-gold);
            transition: color 0.3s;
        }

        .pot.jackpot-win {
            box-shadow: 0 0 30px var(--neon-green), inset 0 0 20px var(--neon-green) !important;
            border-color: var(--neon-green) !important;
            transform: scale(1.1);
        }
        
        .pot.jackpot-win h2, .pot.jackpot-win .amount {
            color: var(--neon-green) !important;
            text-shadow: 0 0 10px var(--neon-green) !important;
        }

        /* Slot Machine & Lever Wrapper */
        .machine-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Slot Grid */
        .slot-machine {
            background-image: url('env_reel_backing.png.png');
            background-size: cover;
            background-position: center;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 15px var(--neon-gold), inset 0 0 20px var(--neon-gold);
            border: 2px solid var(--neon-gold);
            display: flex;
            gap: 10px;
            cursor: pointer;
            position: relative;
        }

        .reel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .symbol-box {
            width: 140px; 
            height: 100px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .symbol-img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            transition: transform 0.1s;
        }

        .coin-value {
            position: absolute;
            font-weight: 600;
            font-size: 1.4rem;
            color: var(--neon-gold);
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 10px var(--neon-gold);
            z-index: 10;
        }
        
        .coin-value.jackpot-text {
            color: var(--neon-red);
            font-size: 1.6rem;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 15px var(--neon-red);
            letter-spacing: 1px;
        }

        .win-line {
            box-shadow: 0 0 20px 5px var(--neon-gold) inset !important;
            border-color: var(--neon-gold) !important;
            background-color: rgba(255, 207, 0, 0.2);
            transition: all 0.3s;
        }

        /* Dynamic Payline Multiplier Badge */
        .payline-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: var(--neon-red);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 800;
            z-index: 20;
            box-shadow: 0 0 10px #000, 0 0 10px var(--neon-red);
            border: 1px solid #fff;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Lever Assembly */
        .lever-container {
            width: 40px;
            height: 200px;
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        .lever-base {
            width: 30px;
            height: 80px;
            background: #222;
            border-radius: 5px;
            border: 1px solid #555;
            box-shadow: inset 0 0 10px #000;
            position: absolute;
            bottom: 0;
        }

        .lever-stick {
            width: 12px;
            height: 120px;
            background: linear-gradient(90deg, #999, #eee, #999);
            position: absolute;
            bottom: 60px;
            transform-origin: bottom center;
            transition: transform 0.3s ease-in-out;
            border-radius: 6px;
        }

        .lever-knob {
            width: 36px;
            height: 36px;
            background: radial-gradient(circle at 10px 10px, #ff4d6d, var(--neon-red));
            border-radius: 50%;
            position: absolute;
            top: -15px;
            left: -12px;
            box-shadow: 0 0 10px var(--neon-red);
        }

        .lever-container.pull .lever-stick {
            transform: rotateX(70deg) scaleY(0.6);
        }

        /* Controls */
        .controls {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 120px;
            padding: 5px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            font-weight: 100;
            font-size: 0.8rem;
            color: #aaa;
            letter-spacing: 1px;
        }

        .stat-value {
            font-weight: 600;
            font-size: 1.4rem;
            color: #fff;
            transition: color 0.3s;
        }

        .win-flash {
            color: var(--neon-green) !important;
            text-shadow: 0 0 15px var(--neon-green);
            transform: scale(1.1);
        }

        button {
            background: transparent;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 15px 25px;
            border: 1px solid var(--neon-red);
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 8px var(--neon-red) inset, 0 0 8px var(--neon-red);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover:not(:disabled) {
            background: rgba(255, 0, 60, 0.2);
            box-shadow: 0 0 15px var(--neon-red) inset, 0 0 15px var(--neon-red);
        }

        button:active:not(:disabled) {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            border-color: #555;
        }

        .multi-btn {
            border-color: #00ccff;
            box-shadow: 0 0 8px #00ccff inset, 0 0 8px #00ccff;
        }

        .multi-btn:hover:not(:disabled) {
            background: rgba(0, 204, 255, 0.2);
            box-shadow: 0 0 15px #00ccff inset, 0 0 15px #00ccff;
        }

        .multi-btn.active-x2 {
            border-color: #ff00ff;
            box-shadow: 0 0 12px #ff00ff inset, 0 0 12px #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
        }

        .multi-btn.active-x5 {
            border-color: var(--neon-gold);
            box-shadow: 0 0 12px var(--neon-gold) inset, 0 0 12px var(--neon-gold);
            text-shadow: 0 0 5px var(--neon-gold);
        }

        .spin-btn {
            border-color: var(--neon-gold);
            box-shadow: 0 0 10px var(--neon-gold) inset, 0 0 10px var(--neon-gold);
            font-size: 1.3rem;
            padding: 15px 50px;
        }

        .spin-btn:hover:not(:disabled) {
            background: rgba(255, 207, 0, 0.2);
            box-shadow: 0 0 20px var(--neon-gold) inset, 0 0 20px var(--neon-gold);
        }
        
        .spinning .symbol-img {
            animation: blurSpin 0.1s infinite;
        }

        @keyframes blurSpin {
            0% { transform: translateY(-50%) scaleY(1.5); opacity: 0.5; }
            100% { transform: translateY(50%) scaleY(1.5); opacity: 0.5; }
        }

    </style>
</head>
<body>

    <div class="pots-container">
        <div class="pot" id="grand-container">
            <h2>GRAND</h2>
            <div class="amount" id="grand-pot">$5,000.00</div>
        </div>
        <div class="pot" id="major-container">
            <h2>MAJOR</h2>
            <div class="amount" id="major-pot">$1,000.00</div>
        </div>
        <div class="pot" id="minor-container">
            <h2>MINOR</h2>
            <div class="amount" id="minor-pot">$250.00</div>
        </div>
    </div>

    <div class="machine-wrapper">
        <div class="slot-machine" id="grid" onclick="spin()">
            <!-- Grid generated by JS -->
        </div>
        
        <div class="lever-container" id="lever" onclick="spin()">
            <div class="lever-base"></div>
            <div class="lever-stick">
                <div class="lever-knob"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="stat-box">
            <div class="stat-label">BANKROLL</div>
            <div class="stat-value" id="bankroll-display">$10,000.00</div>
        </div>
        
        <div class="stat-box">
            <div class="stat-label">TOTAL BET</div>
            <div class="stat-value" id="bet-display">$10.00</div>
        </div>

        <button id="raise-btn" onclick="raiseBid()">Raise Base</button>
        <button id="max-bet-btn" onclick="maxBid()">Max Base</button>
        
        <button class="multi-btn" id="multiplier-btn" onclick="toggleMultiplier()">Multiplier: x1</button>

        <div class="stat-box">
            <div class="stat-label">LAST WIN</div>
            <div class="stat-value" id="win-display">$0.00</div>
        </div>

        <button class="spin-btn" id="spin-btn" onclick="spin()">SPIN</button>
    </div>

    <script>
        // Web Audio API Context
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playWinSound() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.type = 'sine'; 
            
            const now = audioCtx.currentTime;
            
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            osc.frequency.setValueAtTime(783.99, now + 0.2);
            osc.frequency.setValueAtTime(1046.50, now + 0.3);
            
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05);
            gainNode.gain.setValueAtTime(0.3, now + 0.4);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
            
            osc.start(now);
            osc.stop(now + 1);
        }

        let bankroll = 10000;
        let baseBet = 10;
        let winMultiplier = 1;
        const MAX_BET = 10000;
        const MIN_BET = 10;
        let isSpinning = false;
        
        let gridData = [[], [], [], [], []];

        const SYMBOLS = [
            'symbol_a.png.png',
            'symbol_k.png.png',
            'symbol_q.png.png',
            'symbol_j.png.png',
            'symbol_pepper.png.png',
            'symbol_sycee.png.png',
            'symbol_wild.png.png',
            'symbol_coin.png.png'
        ];

        const PAYTABLE = {
            'symbol_wild.png.png': { 3: 5, 4: 20, 5: 100 },
            'symbol_sycee.png.png': { 3: 4, 4: 15, 5: 50 },
            'symbol_pepper.png.png': { 3: 3, 4: 10, 5: 30 },
            'symbol_a.png.png': { 3: 1, 4: 3, 5: 10 },
            'symbol_k.png.png': { 3: 1, 4: 3, 5: 10 },
            'symbol_q.png.png': { 3: 0.5, 4: 2, 5: 5 },
            'symbol_j.png.png': { 3: 0.5, 4: 2, 5: 5 }
        };

        const formatMoney = (amount) => {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
        };

        const gridEl = document.getElementById('grid');
        const cols = 5;
        const rows = 3;

        function initGrid() {
            gridEl.innerHTML = '';
            for (let c = 0; c < cols; c++) {
                const reel = document.createElement('div');
                reel.className = 'reel';
                reel.id = `reel-${c}`;
                
                for (let r = 0; r < rows; r++) {
                    const box = document.createElement('div');
                    box.className = 'symbol-box';
                    box.id = `box-${c}-${r}`;
                    
                    const img = document.createElement('img');
                    img.className = 'symbol-img';
                    img.src = 'symbol_wild.png.png';
                    img.onerror = function() { this.style.display = 'none'; }; 
                    
                    box.appendChild(img);
                    reel.appendChild(box);
                }
                gridEl.appendChild(reel);
            }
            updateDisplay();
        }

        function updateDisplay() {
            const totalBetCost = baseBet * winMultiplier;
            document.getElementById('bankroll-display').innerText = formatMoney(bankroll);
            document.getElementById('bet-display').innerText = formatMoney(totalBetCost);
            
            // Dynamically scale Jackpots based on total bet size
            document.getElementById('minor-pot').innerText = formatMoney(totalBetCost * 25);
            document.getElementById('major-pot').innerText = formatMoney(totalBetCost * 100);
            document.getElementById('grand-pot').innerText = formatMoney(totalBetCost * 500);
        }

        function raiseBid() {
            if (isSpinning) return;
            if (baseBet < 100) baseBet += 10;
            else if (baseBet < 1000) baseBet += 100;
            else if (baseBet < MAX_BET) baseBet += 1000;
            else baseBet = MIN_BET;
            
            if (baseBet * winMultiplier > bankroll) baseBet = Math.floor(bankroll / winMultiplier);
            updateDisplay();
        }

        function maxBid() {
            if (isSpinning) return;
            baseBet = Math.floor(Math.min(MAX_BET, bankroll / winMultiplier));
            updateDisplay();
        }

        function toggleMultiplier() {
            if (isSpinning) return;
            const btn = document.getElementById('multiplier-btn');
            btn.classList.remove('active-x2', 'active-x5');

            if (winMultiplier === 1) {
                winMultiplier = 2;
                btn.classList.add('active-x2');
            } else if (winMultiplier === 2) {
                winMultiplier = 5;
                btn.classList.add('active-x5');
            } else {
                winMultiplier = 1;
            }

            btn.innerText = `Multiplier: x${winMultiplier}`;
            
            if (baseBet * winMultiplier > bankroll) {
                baseBet = Math.max(MIN_BET, Math.floor(bankroll / winMultiplier));
            }
            updateDisplay();
        }

        function spin() {
            if (!audioCtx) audioCtx = new AudioContext();
            
            const totalBetCost = baseBet * winMultiplier;
            if (isSpinning || totalBetCost > bankroll || bankroll <= 0) return;
            
            isSpinning = true;
            bankroll -= totalBetCost;
            
            const winDisplayEl = document.getElementById('win-display');
            winDisplayEl.innerText = "$0.00";
            winDisplayEl.classList.remove('win-flash');
            
            // Remove previous jackpot flashes
            document.querySelectorAll('.pot').forEach(pot => pot.classList.remove('jackpot-win'));
            
            updateDisplay();
            
            document.querySelectorAll('.symbol-box').forEach(b => {
                b.classList.remove('win-line');
                const badge = b.querySelector('.payline-badge');
                if (badge) badge.remove();
                b.dataset.jackpotType = ""; // Reset jackpot tracking
            });
            
            const lever = document.getElementById('lever');
            lever.classList.add('pull');
            setTimeout(() => lever.classList.remove('pull'), 400);

            const btn = document.getElementById('spin-btn');
            btn.disabled = true;

            const reels = document.querySelectorAll('.reel');
            
            reels.forEach((reel, colIndex) => {
                const boxes = reel.querySelectorAll('.symbol-box');
                
                boxes.forEach(box => {
                    box.classList.add('spinning');
                    const oldVal = box.querySelector('.coin-value');
                    if (oldVal) oldVal.remove();
                });

                setTimeout(() => {
                    boxes.forEach((box, rowIndex) => {
                        box.classList.remove('spinning');
                        
                        const randomImg = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                        gridData[colIndex][rowIndex] = randomImg; 
                        
                        const imgEl = box.querySelector('.symbol-img');
                        imgEl.src = randomImg;
                        imgEl.style.display = 'block';

                        if (randomImg === 'symbol_coin.png.png') {
                            const valEl = document.createElement('div');
                            valEl.className = 'coin-value';
                            
                            // Jackpot Roll Logic
                            const jackpotRoll = Math.random();
                            let cashValue = 0;
                            let label = "";

                            if (jackpotRoll > 0.99) {
                                label = "GRAND";
                                cashValue = totalBetCost * 500;
                            } else if (jackpotRoll > 0.96) {
                                label = "MAJOR";
                                cashValue = totalBetCost * 100;
                            } else if (jackpotRoll > 0.90) {
                                label = "MINOR";
                                cashValue = totalBetCost * 25;
                            } else {
                                const multi = [0.5, 1, 2, 5, 10][Math.floor(Math.random() * 5)];
                                cashValue = totalBetCost * multi;
                                label = formatMoney(cashValue);
                            }

                            if (label === "GRAND" || label === "MAJOR" || label === "MINOR") {
                                valEl.classList.add('jackpot-text');
                                box.dataset.jackpotType = label.toLowerCase();
                            }

                            valEl.innerText = label;
                            box.dataset.cash = cashValue; 
                            box.appendChild(valEl);
                        } else {
                            box.dataset.cash = 0;
                        }
                    });

                    if (colIndex === reels.length - 1) {
                        setTimeout(evaluateBoard, 300); 
                    }
                }, 500 + (colIndex * 300));
            });
        }

        function evaluateBoard() {
            let totalWin = 0;
            let triggeredWin = false;
            
            // Standard paylines
            for (let row = 0; row < rows; row++) {
                let matchCount = 1;
                let firstSymbol = gridData[0][row];
                
                let targetSymbol = firstSymbol;
                if (targetSymbol === 'symbol_wild.png.png') {
                    for (let c = 1; c < cols; c++) {
                        if (gridData[c][row] !== 'symbol_wild.png.png' && gridData[c][row] !== 'symbol_coin.png.png') {
                            targetSymbol = gridData[c][row];
                            break;
                        }
                    }
                }

                if (targetSymbol === 'symbol_coin.png.png') continue;

                let winningBoxes = [`box-0-${row}`];

                for (let col = 1; col < cols; col++) {
                    const currentSymbol = gridData[col][row];
                    if (currentSymbol === targetSymbol || currentSymbol === 'symbol_wild.png.png') {
                        matchCount++;
                        winningBoxes.push(`box-${col}-${row}`);
                    } else {
                        break; 
                    }
                }

                if (matchCount >= 3 && PAYTABLE[targetSymbol]) {
                    const multiplier = PAYTABLE[targetSymbol][matchCount];
                    totalWin += (baseBet * multiplier) * winMultiplier;
                    triggeredWin = true;
                    
                    winningBoxes.forEach(id => {
                        document.getElementById(id).classList.add('win-line');
                    });

                    const lastBoxId = winningBoxes[winningBoxes.length - 1];
                    const lastBoxEl = document.getElementById(lastBoxId);
                    
                    const badge = document.createElement('div');
                    badge.className = 'payline-badge';
                    badge.innerText = `Line x${multiplier}`;
                    lastBoxEl.appendChild(badge);
                }
            }

            // Coin Scatter & Jackpots
            let coinBoxes = [];
            let coinTotal = 0;
            for (let c = 0; c < cols; c++) {
                for (let r = 0; r < rows; r++) {
                    if (gridData[c][r] === 'symbol_coin.png.png') {
                        const box = document.getElementById(`box-${c}-${r}`);
                        coinBoxes.push(box);
                        coinTotal += parseFloat(box.dataset.cash);
                    }
                }
            }

            if (coinBoxes.length >= 3) {
                totalWin += coinTotal;
                triggeredWin = true;
                
                coinBoxes.forEach(box => {
                    box.classList.add('win-line');
                    const badge = document.createElement('div');
                    badge.className = 'payline-badge';
                    
                    if (box.dataset.jackpotType) {
                        // Flashes the specific Jackpot Pot at the top of the machine
                        document.getElementById(`${box.dataset.jackpotType}-container`).classList.add('jackpot-win');
                        badge.style.background = 'var(--neon-green)';
                        badge.style.color = '#000';
                        badge.innerText = `${box.dataset.jackpotType.toUpperCase()}!`;
                    } else {
                        badge.style.background = 'var(--neon-gold)';
                        badge.style.color = '#000';
                        badge.innerText = `CASH!`;
                    }
                    box.appendChild(badge);
                });
            }

            // Process Win
            if (triggeredWin && totalWin > 0) {
                playWinSound();
                bankroll += totalWin;
                
                const winDisplayEl = document.getElementById('win-display');
                winDisplayEl.innerText = formatMoney(totalWin);
                winDisplayEl.classList.add('win-flash');
                
                const bankrollEl = document.getElementById('bankroll-display');
                bankrollEl.classList.add('win-flash');
                setTimeout(() => bankrollEl.classList.remove('win-flash'), 1000);
            }

            updateDisplay();
            isSpinning = false;
            document.getElementById('spin-btn').disabled = false;
        }

        initGrid();
    </script>
</body>
</html>
