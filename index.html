<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Dragon Slots</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Orbitron:wght@500;700&display=swap');

        :root {
            --gold-light: #FFDF00;
            --gold-dark: #B8860B;
            --red-dark: #3a0000;
            --red-bright: #ff1a1a;
            --neon-gold: #ffea00;
            --neon-red: #ff003c;
        }

        body {
            background-color: #050000;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(80, 0, 0, 0.8) 0%, transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(40, 30, 0, 0.8) 0%, transparent 60%);
            font-family: 'Orbitron', sans-serif;
            color: white;
            overflow-x: hidden;
            touch-action: manipulation;
            user-select: none;
        }

        /* typography */
        .font-cinzel { font-family: 'Cinzel', serif; }
        
        .text-gold {
            background: linear-gradient(to bottom, #FFFDE4, #FFDF00, #B8860B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8));
        }

        .text-neon-red {
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-red), 0 0 40px var(--neon-red);
        }

        /* Container & Borders */
        .machine-casing {
            border: 4px solid var(--gold-dark);
            border-radius: 16px;
            box-shadow: 0 0 20px var(--gold-dark), inset 0 0 30px #000;
            background: linear-gradient(to bottom, rgba(20,0,0,0.9), rgba(5,0,0,1));
            position: relative;
        }
        
        .machine-casing::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border-radius: 20px;
            border: 2px solid rgba(255, 223, 0, 0.3);
            pointer-events: none;
        }

        /* Bonus Pots */
        .pot-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 120px;
            width: 140px;
            background: radial-gradient(ellipse at bottom, rgba(255,215,0,0.2) 0%, transparent 70%);
            border-bottom: 3px solid var(--gold-dark);
            border-radius: 50% 50% 10px 10px;
            animation: pulse-glow 3s infinite alternate;
        }

        .pot-container h3 {
            position: absolute;
            top: 10px;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-align: center;
            width: 100%;
        }

        .pot-container.grand h3 { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
        .pot-container.major h3 { color: #00ffff; text-shadow: 0 0 10px #00ffff; }
        .pot-container.minor h3 { color: #00ff00; text-shadow: 0 0 10px #00ff00; }

        .bowl-graphic {
            font-size: 3.5rem;
            filter: drop-shadow(0 -5px 10px rgba(255, 100, 0, 0.8));
            animation: float 4s ease-in-out infinite;
        }

        /* Reels Area */
        .reels-container {
            background: #000;
            border: 3px solid #8b6508;
            border-radius: 8px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            box-shadow: inset 0 0 30px rgba(0,0,0,1);
            position: relative;
        }

        .reel {
            display: grid;
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
        }

        .symbol-slot {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
            border: 1px solid #333;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        /* Coins */
        .coin {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b, #5c4305);
            border: 2px solid #fffdf2;
            box-shadow: 0 0 15px var(--neon-gold), inset 0 0 10px #ffea00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            color: #3e2700;
            text-shadow: 0 1px 0px rgba(255,255,255,0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Controls */
        .control-panel {
            background: linear-gradient(to top, #111, #222);
            border-top: 2px solid #555;
            padding: 15px;
            border-radius: 0 0 12px 12px;
        }

        .led-display {
            background: #000;
            border: 2px inset #444;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #0f0;
            padding: 5px 10px;
            border-radius: 4px;
            text-align: center;
        }

        .btn-action {
            background: linear-gradient(to bottom, #444, #111);
            border: 2px solid #666;
            color: white;
            text-transform: uppercase;
            font-weight: bold;
            border-radius: 6px;
            transition: all 0.1s;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        
        .btn-action:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
            border-color: var(--gold-light);
        }
        .btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spin-btn {
            background: radial-gradient(circle, #ff3333, #990000);
            border: 3px solid var(--gold-light);
            color: white;
            font-size: 1.5rem;
            text-transform: uppercase;
            font-weight: 900;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6), inset 0 0 15px rgba(255,255,255,0.4);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .spin-btn:active:not(:disabled) {
            transform: scale(0.92);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
        }
        .spin-btn:disabled {
            filter: grayscale(80%);
            cursor: not-allowed;
        }

        /* Animations */
        @keyframes spin-blur {
            0% { transform: translateY(0); filter: blur(0); }
            50% { transform: translateY(100px); filter: blur(8px); }
            50.01% { transform: translateY(-100px); filter: blur(8px); }
            100% { transform: translateY(0); filter: blur(0); }
        }

        .is-spinning .symbol-content {
            animation: spin-blur 0.15s infinite linear;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 -10px 20px -10px rgba(255, 0, 0, 0); }
            100% { box-shadow: 0 -15px 30px -5px rgba(255, 50, 0, 0.6); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(180deg); opacity: 0; }
            80% { transform: scale(1.1) rotate(-10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        @keyframes winPulse {
            0%, 100% { background-color: rgba(255, 215, 0, 0.1); border-color: #333; }
            50% { background-color: rgba(255, 215, 0, 0.4); border-color: var(--gold-light); }
        }

        .win-cell {
            animation: winPulse 1s infinite;
            z-index: 10;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-6">

    <!-- Loading Overlay -->
    <div id="loading-screen">
        <h1 class="text-4xl text-gold font-cinzel mb-4">Connecting to Server...</h1>
        <div class="w-16 h-16 border-4 border-yellow-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <!-- Main Game UI -->
    <div class="machine-casing w-full max-w-4xl mx-auto flex flex-col hidden" id="game-ui">
        
        <!-- Top Section: Pots -->
        <div class="flex justify-around items-end pt-6 pb-4 px-4 relative z-10">
            <div class="pot-container grand">
                <h3 class="font-black font-cinzel">GRAND</h3>
                <div class="bowl-graphic">🏺</div>
            </div>
            <div class="pot-container major">
                <h3 class="font-black font-cinzel">MAJOR</h3>
                <div class="bowl-graphic">🍲</div>
            </div>
            <div class="pot-container minor">
                <h3 class="font-black font-cinzel">MINOR</h3>
                <div class="bowl-graphic">🥣</div>
            </div>
        </div>

        <!-- Title / Message Area -->
        <div class="text-center py-2 relative z-10 bg-black/40">
            <h1 class="text-3xl sm:text-4xl text-gold font-cinzel font-black tracking-widest drop-shadow-lg" id="message-board">GOLDEN DRAGON</h1>
        </div>

        <!-- Slot Grid Area -->
        <div class="p-4 sm:p-6">
            <div class="reels-container" id="reels-grid">
                <!-- Reels generated by JS -->
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel flex flex-wrap gap-4 items-center justify-between">
            
            <!-- Bankroll -->
            <div class="flex flex-col flex-1 min-w-[120px]">
                <span class="text-xs text-gray-400 uppercase tracking-wider mb-1">Bankroll</span>
                <div class="led-display text-xl sm:text-2xl" id="bankroll-display">$---</div>
            </div>

            <!-- Win Display -->
            <div class="flex flex-col flex-1 min-w-[120px]">
                <span class="text-xs text-gray-400 uppercase tracking-wider mb-1 text-center">Win</span>
                <div class="led-display text-xl sm:text-2xl text-yellow-400 border-yellow-600" id="win-display">$0</div>
            </div>

            <!-- Bet Controls -->
            <div class="flex flex-col gap-2 items-center min-w-[150px]">
                <div class="flex w-full justify-between items-center bg-black rounded p-1 border border-gray-700">
                    <button class="text-gray-400 px-2 hover:text-white" id="btn-decrease-bet">◀</button>
                    <span class="text-white font-bold" id="current-bet-display">$10</span>
                    <button class="text-gray-400 px-2 hover:text-white" id="btn-increase-bet">▶</button>
                </div>
                <div class="flex w-full gap-2">
                    <button class="btn-action flex-1 py-1 text-xs" id="btn-max-bet">Max $10k</button>
                </div>
            </div>

            <!-- Spin Button -->
            <div class="flex justify-center min-w-[100px] ml-auto sm:ml-0">
                <button id="btn-spin" class="spin-btn">SPIN</button>
            </div>
        </div>
    </div>

    <!-- Firebase Logic & Game Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Setup ---
        let app, db, auth, userId, appId;
        
        try {
            appId = typeof __app_id !== 'undefined' ? __app_id : 'golden-dragon-slots';
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            
            if (firebaseConfig) {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (token) {
                    signInWithCustomToken(auth, token).catch(e => {
                        console.error("Custom token failed, trying anonymous", e);
                        signInAnonymously(auth);
                    });
                } else {
                    signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        initGameData();
                    }
                });
            } else {
                // Fallback for purely local testing without Firebase config injected
                console.warn("No Firebase config found. Running in local memory mode.");
                initLocalGame();
            }
        } catch (error) {
            console.error("Firebase initialization error:", error);
            initLocalGame(); // Fallback
        }

        // --- Game Engine Variables ---
        const ROWS = 3;
        const COLS = 5;
        let bankroll = 0;
        let currentBet = 10;
        let isSpinning = false;
        const betOptions = [5, 10, 25, 50, 100, 250, 500, 1000, 5000, 10000];

        // Symbols definitions
        // Standard symbols: payout multipliers based on bet
        const SYMBOLS = {
            'DRAGON': { char: '🐉', type: 'high', payouts: {3: 5, 4: 10, 5: 50} },
            'TIGER': { char: '🐯', type: 'high', payouts: {3: 3, 4: 8, 5: 25} },
            'TURTLE': { char: '🐢', type: 'high', payouts: {3: 2, 4: 5, 5: 15} },
            'A': { char: 'A', type: 'low', payouts: {3: 0.5, 4: 2, 5: 5} },
            'K': { char: 'K', type: 'low', payouts: {3: 0.5, 4: 1.5, 5: 4} },
            'Q': { char: 'Q', type: 'low', payouts: {3: 0.2, 4: 1, 5: 3} },
            'J': { char: 'J', type: 'low', payouts: {3: 0.2, 4: 1, 5: 2} }
        };
        const SYMBOL_KEYS = Object.keys(SYMBOLS);

        // Grid State [col][row]
        let grid = Array.from({length: COLS}, () => Array(ROWS).fill(null));

        // --- DOM Elements ---
        const reelsGridEl = document.getElementById('reels-grid');
        const bankrollDisplay = document.getElementById('bankroll-display');
        const betDisplay = document.getElementById('current-bet-display');
        const winDisplay = document.getElementById('win-display');
        const msgBoard = document.getElementById('message-board');
        const btnSpin = document.getElementById('btn-spin');
        const btnIncBet = document.getElementById('btn-increase-bet');
        const btnDecBet = document.getElementById('btn-decrease-bet');
        const btnMaxBet = document.getElementById('btn-max-bet');

        // --- Initialization ---
        async function initGameData() {
            if (!db || !userId) return initLocalGame();
            try {
                const userRef = doc(db, 'artifacts', appId, 'users', userId, 'gameState', 'slotMachine');
                const docSnap = await getDoc(userRef);
                if (docSnap.exists()) {
                    bankroll = docSnap.data().bankroll;
                } else {
                    bankroll = 10000; // Starting bankroll
                    await setDoc(userRef, { bankroll: bankroll });
                }
                startGameUI();
            } catch (e) {
                console.error("Firestore read error", e);
                initLocalGame();
            }
        }

        function initLocalGame() {
            if (bankroll === 0) bankroll = 10000;
            startGameUI();
        }

        function startGameUI() {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            buildGrid();
            updateUI();
        }

        async function saveBankroll() {
            if (!db || !userId) return;
            try {
                const userRef = doc(db, 'artifacts', appId, 'users', userId, 'gameState', 'slotMachine');
                await setDoc(userRef, { bankroll: bankroll }, { merge: true });
            } catch (e) {
                console.error("Failed to save bankroll", e);
            }
        }

        // --- Core Game Functions ---
        function formatMoney(amount) {
            return '$' + amount.toLocaleString('en-US');
        }

        function updateUI() {
            bankrollDisplay.innerText = formatMoney(bankroll);
            betDisplay.innerText = formatMoney(currentBet);
            
            // Adjust current bet if it exceeds bankroll
            if (currentBet > bankroll && bankroll > 0) {
                currentBet = [...betOptions].reverse().find(b => b <= bankroll) || bankroll;
                betDisplay.innerText = formatMoney(currentBet);
            }
            
            btnSpin.disabled = isSpinning || bankroll < currentBet || bankroll === 0;
            btnMaxBet.disabled = isSpinning || bankroll === 0;
            btnIncBet.disabled = isSpinning || bankroll === 0;
            btnDecBet.disabled = isSpinning || bankroll === 0;
        }

        function setMsg(msg, isAlert = false) {
            msgBoard.innerText = msg;
            msgBoard.className = `text-3xl sm:text-4xl font-cinzel font-black tracking-widest drop-shadow-lg transition-colors duration-300 ${isAlert ? 'text-neon-red' : 'text-gold'}`;
        }

        function buildGrid() {
            reelsGridEl.innerHTML = '';
            for (let c = 0; c < COLS; c++) {
                const reelDiv = document.createElement('div');
                reelDiv.className = 'reel';
                reelDiv.id = `reel-${c}`;
                
                for (let r = 0; r < ROWS; r++) {
                    const slot = document.createElement('div');
                    slot.className = 'symbol-slot';
                    slot.id = `slot-${c}-${r}`;
                    
                    const content = document.createElement('div');
                    content.className = 'symbol-content';
                    content.id = `content-${c}-${r}`;
                    // Initial random fill
                    const randKey = SYMBOL_KEYS[Math.floor(Math.random() * SYMBOL_KEYS.length)];
                    content.innerText = SYMBOLS[randKey].char;
                    
                    slot.appendChild(content);
                    reelDiv.appendChild(slot);
                }
                reelsGridEl.appendChild(reelDiv);
            }
        }

        // Generate result for a specific cell
        function generateCell() {
            // 15% chance for a Coin (Scatter)
            if (Math.random() < 0.15) {
                // Determine coin value based on current bet multiplier
                const multipliers = [0.5, 1, 2, 5, 10];
                const mult = multipliers[Math.floor(Math.random() * multipliers.length)];
                return { type: 'coin', val: currentBet * mult };
            } else {
                // Standard Symbol
                const randKey = SYMBOL_KEYS[Math.floor(Math.random() * SYMBOL_KEYS.length)];
                return { type: 'symbol', key: randKey, char: SYMBOLS[randKey].char };
            }
        }

        async function spinReels() {
            if (isSpinning || bankroll < currentBet) return;
            
            isSpinning = true;
            bankroll -= currentBet;
            saveBankroll();
            winDisplay.innerText = "$0";
            setMsg("GOOD LUCK!");
            updateUI();

            // Clear previous wins
            document.querySelectorAll('.symbol-slot').forEach(el => el.classList.remove('win-cell'));

            // Pre-calculate results
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS; r++) {
                    grid[c][r] = generateCell();
                }
            }

            // Animate Reels
            const spinPromises = [];
            for (let c = 0; c < COLS; c++) {
                spinPromises.push(animateReel(c));
            }

            await Promise.all(spinPromises);
            evaluateWins();
        }

        async function animateReel(colIndex) {
            const reel = document.getElementById(`reel-${colIndex}`);
            reel.classList.add('is-spinning');
            
            // Visual blurring cycle
            for(let r=0; r<ROWS; r++){
                const content = document.getElementById(`content-${colIndex}-${r}`);
                content.innerText = '🌀'; // Fast blur representation
            }

            // Staggered stop timing
            const delay = 400 + (colIndex * 300);
            await new Promise(res => setTimeout(res, delay));
            
            reel.classList.remove('is-spinning');
            
            // Set final results
            for (let r = 0; r < ROWS; r++) {
                const cellData = grid[colIndex][r];
                const content = document.getElementById(`content-${colIndex}-${r}`);
                content.innerHTML = ''; // clear

                if (cellData.type === 'coin') {
                    const coinDiv = document.createElement('div');
                    coinDiv.className = 'coin';
                    coinDiv.innerText = '$' + cellData.val;
                    content.appendChild(coinDiv);
                } else {
                    content.innerText = cellData.char;
                }
            }
        }

        function evaluateWins() {
            let totalWin = 0;
            const winningCells = new Set(); // store 'c,r' strings

            // 1. Evaluate Scatter Coins
            let coinsHit = 0;
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS; r++) {
                    if (grid[c][r].type === 'coin') {
                        totalWin += grid[c][r].val;
                        winningCells.add(`${c},${r}`);
                        coinsHit++;
                    }
                }
            }

            // 2. Evaluate Standard Paylines (simplified: 3 horizontal, 2 diagonal)
            const lines = [
                [{c:0, r:0}, {c:1, r:0}, {c:2, r:0}, {c:3, r:0}, {c:4, r:0}], // Top
                [{c:0, r:1}, {c:1, r:1}, {c:2, r:1}, {c:3, r:1}, {c:4, r:1}], // Mid
                [{c:0, r:2}, {c:1, r:2}, {c:2, r:2}, {c:3, r:2}, {c:4, r:2}], // Bot
                [{c:0, r:0}, {c:1, r:1}, {c:2, r:2}, {c:3, r:1}, {c:4, r:0}], // V
                [{c:0, r:2}, {c:1, r:1}, {c:2, r:0}, {c:3, r:1}, {c:4, r:2}]  // Inverted V
            ];

            lines.forEach(line => {
                let matchCount = 1;
                let firstSymbol = grid[line[0].c][line[0].r];
                
                if (firstSymbol.type === 'symbol') {
                    const key = firstSymbol.key;
                    let lineCells = [`${line[0].c},${line[0].r}`];
                    
                    for (let i = 1; i < COLS; i++) {
                        const cell = grid[line[i].c][line[i].r];
                        if (cell.type === 'symbol' && cell.key === key) {
                            matchCount++;
                            lineCells.push(`${line[i].c},${line[i].r}`);
                        } else {
                            break; // continuous from left
                        }
                    }

                    if (matchCount >= 3) {
                        const multiplier = SYMBOLS[key].payouts[matchCount];
                        totalWin += (currentBet * multiplier);
                        lineCells.forEach(lc => winningCells.add(lc));
                    }
                }
            });

            // Process Payout
            if (totalWin > 0) {
                // Highlight wins
                winningCells.forEach(coord => {
                    const [c, r] = coord.split(',');
                    document.getElementById(`slot-${c}-${r}`).classList.add('win-cell');
                });

                bankroll += totalWin;
                saveBankroll();
                
                winDisplay.innerText = formatMoney(totalWin);
                if (totalWin >= currentBet * 10) {
                    setMsg("BIG WIN!", true);
                } else if (coinsHit >= 4) {
                    setMsg("COIN STORM!");
                } else {
                    setMsg("WINNER!");
                }
            } else {
                setMsg("GOLDEN DRAGON");
            }

            isSpinning = false;
            updateUI();
        }

        // --- Event Listeners ---
        btnSpin.addEventListener('click', spinReels);

        btnIncBet.addEventListener('click', () => {
            if (isSpinning) return;
            const currentIndex = betOptions.indexOf(currentBet);
            if (currentIndex < betOptions.length - 1) {
                let nextBet = betOptions[currentIndex + 1];
                if (nextBet <= bankroll) {
                    currentBet = nextBet;
                    updateUI();
                }
            }
        });

        btnDecBet.addEventListener('click', () => {
            if (isSpinning) return;
            const currentIndex = betOptions.indexOf(currentBet);
            if (currentIndex > 0) {
                currentBet = betOptions[currentIndex - 1];
                updateUI();
            }
        });

        btnMaxBet.addEventListener('click', () => {
            if (isSpinning || bankroll === 0) return;
            currentBet = Math.min(10000, bankroll);
            // Snap to nearest lower predefined option if we want strict increments, 
            // but setting it directly to max available is fine for UX.
            updateUI();
        });

    </script>
</body>
