<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian Fusion Vegas Slots</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-red: #ff003c;
            --neon-gold: #ffcf00;
            --bg-dark: #0a0a0a;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        /* Top Pots */
        .pots-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .pot {
            text-align: center;
            padding: 15px 30px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 10px var(--neon-red), inset 0 0 10px var(--neon-red);
            border: 1px solid var(--neon-red);
        }

        .pot h2 {
            margin: 0;
            font-weight: 100;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #fff;
        }

        .pot .amount {
            font-weight: 600;
            font-size: 1.5rem;
            color: var(--neon-gold);
            margin-top: 5px;
            text-shadow: 0 0 5px var(--neon-gold);
        }

        /* Slot Machine & Lever Wrapper */
        .machine-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Slot Grid */
        .slot-machine {
            background-image: url('env_reel_backing.png.png');
            background-size: cover;
            background-position: center;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 15px var(--neon-gold), inset 0 0 20px var(--neon-gold);
            border: 2px solid var(--neon-gold);
            display: flex;
            gap: 10px;
            cursor: pointer; /* Click to spin */
        }

        .reel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .symbol-box {
            width: 140px; /* Expanded horizontally by ~30% */
            height: 100px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .symbol-img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            transition: transform 0.1s;
        }

        .coin-value {
            position: absolute;
            font-weight: 600;
            font-size: 1.4rem;
            color: var(--neon-gold);
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 10px var(--neon-gold);
            z-index: 10;
        }

        /* Win Indicator overlay */
        .win-line {
            box-shadow: 0 0 20px 5px var(--neon-gold) inset !important;
            border-color: var(--neon-gold) !important;
            transition: all 0.3s;
        }

        /* Lever Assembly */
        .lever-container {
            width: 40px;
            height: 200px;
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        .lever-base {
            width: 30px;
            height: 80px;
            background: #222;
            border-radius: 5px;
            border: 1px solid #555;
            box-shadow: inset 0 0 10px #000;
            position: absolute;
            bottom: 0;
        }

        .lever-stick {
            width: 12px;
            height: 120px;
            background: linear-gradient(90deg, #999, #eee, #999);
            position: absolute;
            bottom: 60px;
            transform-origin: bottom center;
            transition: transform 0.3s ease-in-out;
            border-radius: 6px;
        }

        .lever-knob {
            width: 36px;
            height: 36px;
            background: radial-gradient(circle at 10px 10px, #ff4d6d, var(--neon-red));
            border-radius: 50%;
            position: absolute;
            top: -15px;
            left: -12px;
            box-shadow: 0 0 10px var(--neon-red);
        }

        .lever-container.pull .lever-stick {
            transform: rotateX(70deg) scaleY(0.6);
        }

        /* Controls */
        .controls {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 120px;
        }

        .stat-label {
            font-weight: 100;
            font-size: 0.9rem;
            color: #aaa;
            letter-spacing: 1px;
        }

        .stat-value {
            font-weight: 600;
            font-size: 1.5rem;
            color: #fff;
            transition: color 0.3s;
        }

        .win-flash {
            color: var(--neon-gold) !important;
            text-shadow: 0 0 15px var(--neon-gold);
            transform: scale(1.1);
        }

        button {
            background: transparent;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 15px 30px;
            border: 1px solid var(--neon-red);
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 8px var(--neon-red) inset, 0 0 8px var(--neon-red);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover:not(:disabled) {
            background: rgba(255, 0, 60, 0.2);
            box-shadow: 0 0 15px var(--neon-red) inset, 0 0 15px var(--neon-red);
        }

        button:active:not(:disabled) {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            border-color: #555;
        }

        .spin-btn {
            border-color: var(--neon-gold);
            box-shadow: 0 0 10px var(--neon-gold) inset, 0 0 10px var(--neon-gold);
            font-size: 1.3rem;
            padding: 15px 50px;
        }

        .spin-btn:hover:not(:disabled) {
            background: rgba(255, 207, 0, 0.2);
            box-shadow: 0 0 20px var(--neon-gold) inset, 0 0 20px var(--neon-gold);
        }
        
        .spinning .symbol-img {
            animation: blurSpin 0.1s infinite;
        }

        @keyframes blurSpin {
            0% { transform: translateY(-50%) scaleY(1.5); opacity: 0.5; }
            100% { transform: translateY(50%) scaleY(1.5); opacity: 0.5; }
        }

    </style>
</head>
<body>

    <div class="pots-container">
        <div class="pot">
            <h2>GRAND</h2>
            <div class="amount" id="grand-pot">$5,000.00</div>
        </div>
        <div class="pot">
            <h2>MAJOR</h2>
            <div class="amount" id="major-pot">$1,000.00</div>
        </div>
        <div class="pot">
            <h2>MINOR</h2>
            <div class="amount" id="minor-pot">$250.00</div>
        </div>
    </div>

    <div class="machine-wrapper">
        <div class="slot-machine" id="grid" onclick="spin()">
            <!-- Grid generated by JS -->
        </div>
        
        <div class="lever-container" id="lever" onclick="spin()">
            <div class="lever-base"></div>
            <div class="lever-stick">
                <div class="lever-knob"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="stat-box">
            <div class="stat-label">BANKROLL</div>
            <div class="stat-value" id="bankroll-display">$10,000.00</div>
        </div>
        
        <button id="raise-btn" onclick="raiseBid()">Raise Bid</button>
        
        <div class="stat-box">
            <div class="stat-label">CURRENT BET</div>
            <div class="stat-value" id="bet-display">$10.00</div>
        </div>

        <button id="max-bet-btn" onclick="maxBid()">Max Bid</button>
        <button class="spin-btn" id="spin-btn" onclick="spin()">SPIN</button>
    </div>

    <script>
        let bankroll = 10000;
        let currentBet = 10;
        const MAX_BET = 10000;
        const MIN_BET = 10;
        let isSpinning = false;
        
        // Logical grid to evaluate wins: gridData[col][row]
        let gridData = [[], [], [], [], []];

        const SYMBOLS = [
            'symbol_a.png.png',
            'symbol_k.png.png',
            'symbol_q.png.png',
            'symbol_j.png.png',
            'symbol_pepper.png.png',
            'symbol_sycee.png.png',
            'symbol_wild.png.png',
            'symbol_coin.png.png'
        ];

        // Multipliers for landing 3, 4, or 5 of a kind
        const PAYTABLE = {
            'symbol_wild.png.png': { 3: 5, 4: 20, 5: 100 },
            'symbol_sycee.png.png': { 3: 4, 4: 15, 5: 50 },
            'symbol_pepper.png.png': { 3: 3, 4: 10, 5: 30 },
            'symbol_a.png.png': { 3: 1, 4: 3, 5: 10 },
            'symbol_k.png.png': { 3: 1, 4: 3, 5: 10 },
            'symbol_q.png.png': { 3: 0.5, 4: 2, 5: 5 },
            'symbol_j.png.png': { 3: 0.5, 4: 2, 5: 5 }
            // Coins are evaluated separately as instant cash overlay drops
        };

        const formatMoney = (amount) => {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
        };

        const gridEl = document.getElementById('grid');
        const cols = 5;
        const rows = 3;

        function initGrid() {
            gridEl.innerHTML = '';
            for (let c = 0; c < cols; c++) {
                const reel = document.createElement('div');
                reel.className = 'reel';
                reel.id = `reel-${c}`;
                
                for (let r = 0; r < rows; r++) {
                    const box = document.createElement('div');
                    box.className = 'symbol-box';
                    box.id = `box-${c}-${r}`;
                    
                    const img = document.createElement('img');
                    img.className = 'symbol-img';
                    img.src = 'symbol_wild.png.png';
                    img.onerror = function() { this.style.display = 'none'; }; 
                    
                    box.appendChild(img);
                    reel.appendChild(box);
                }
                gridEl.appendChild(reel);
            }
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('bankroll-display').innerText = formatMoney(bankroll);
            document.getElementById('bet-display').innerText = formatMoney(currentBet);
        }

        function raiseBid() {
            if (isSpinning) return;
            if (currentBet < 100) currentBet += 10;
            else if (currentBet < 1000) currentBet += 100;
            else if (currentBet < MAX_BET) currentBet += 1000;
            else currentBet = MIN_BET;
            
            if (currentBet > bankroll) currentBet = bankroll;
            updateDisplay();
        }

        function maxBid() {
            if (isSpinning) return;
            currentBet = Math.min(MAX_BET, bankroll);
            updateDisplay();
        }

        function spin() {
            if (isSpinning || currentBet > bankroll || bankroll <= 0) return;
            
            isSpinning = true;
            bankroll -= currentBet;
            updateDisplay();
            
            // Clear old win highlights
            document.querySelectorAll('.symbol-box').forEach(b => b.classList.remove('win-line'));
            document.getElementById('bankroll-display').classList.remove('win-flash');
            
            // Animate lever
            const lever = document.getElementById('lever');
            lever.classList.add('pull');
            setTimeout(() => lever.classList.remove('pull'), 400);

            const btn = document.getElementById('spin-btn');
            btn.disabled = true;

            const reels = document.querySelectorAll('.reel');
            
            reels.forEach((reel, colIndex) => {
                const boxes = reel.querySelectorAll('.symbol-box');
                
                boxes.forEach(box => {
                    box.classList.add('spinning');
                    const oldVal = box.querySelector('.coin-value');
                    if (oldVal) oldVal.remove();
                });

                setTimeout(() => {
                    boxes.forEach((box, rowIndex) => {
                        box.classList.remove('spinning');
                        
                        const randomImg = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                        gridData[colIndex][rowIndex] = randomImg; // Store in logical grid
                        
                        const imgEl = box.querySelector('.symbol-img');
                        imgEl.src = randomImg;
                        imgEl.style.display = 'block';

                        if (randomImg === 'symbol_coin.png.png') {
                            const valEl = document.createElement('div');
                            valEl.className = 'coin-value';
                            const multi = [0.5, 1, 2, 5, 10][Math.floor(Math.random() * 5)];
                            const cashValue = currentBet * multi;
                            valEl.innerText = formatMoney(cashValue);
                            // Store cash value for payout logic
                            box.dataset.cash = cashValue; 
                            box.appendChild(valEl);
                        } else {
                            box.dataset.cash = 0;
                        }
                    });

                    if (colIndex === reels.length - 1) {
                        setTimeout(evaluateBoard, 300); // Check win shortly after last reel drops
                    }
                }, 500 + (colIndex * 300));
            });
        }

        function evaluateBoard() {
            let totalWin = 0;
            
            // Define basic horizontal paylines (Rows 0, 1, 2)
            for (let row = 0; row < rows; row++) {
                let matchCount = 1;
                let firstSymbol = gridData[0][row];
                
                // If first is a wild, find the first non-wild to determine the target symbol
                let targetSymbol = firstSymbol;
                if (targetSymbol === 'symbol_wild.png.png') {
                    for (let c = 1; c < cols; c++) {
                        if (gridData[c][row] !== 'symbol_wild.png.png' && gridData[c][row] !== 'symbol_coin.png.png') {
                            targetSymbol = gridData[c][row];
                            break;
                        }
                    }
                }

                // Skip line check if line is purely coins (handled separately)
                if (targetSymbol === 'symbol_coin.png.png') continue;

                let winningBoxes = [`box-0-${row}`];

                for (let col = 1; col < cols; col++) {
                    const currentSymbol = gridData[col][row];
                    if (currentSymbol === targetSymbol || currentSymbol === 'symbol_wild.png.png') {
                        matchCount++;
                        winningBoxes.push(`box-${col}-${row}`);
                    } else {
                        break; // Streak broken
                    }
                }

                if (matchCount >= 3 && PAYTABLE[targetSymbol]) {
                    const multiplier = PAYTABLE[targetSymbol][matchCount];
                    totalWin += currentBet * multiplier;
                    
                    // Highlight winning boxes
                    winningBoxes.forEach(id => {
                        document.getElementById(id).classList.add('win-line');
                    });
                }
            }

            // Process Coins (Instant win if 3 or more appear anywhere)
            let coinBoxes = [];
            let coinTotal = 0;
            for (let c = 0; c < cols; c++) {
                for (let r = 0; r < rows; r++) {
                    if (gridData[c][r] === 'symbol_coin.png.png') {
                        const box = document.getElementById(`box-${c}-${r}`);
                        coinBoxes.push(box);
                        coinTotal += parseFloat(box.dataset.cash);
                    }
                }
            }

            if (coinBoxes.length >= 3) {
                totalWin += coinTotal;
                coinBoxes.forEach(box => box.classList.add('win-line'));
            }

            // Apply Winnings
            if (totalWin > 0) {
                bankroll += totalWin;
                const bankrollEl = document.getElementById('bankroll-display');
                bankrollEl.classList.add('win-flash');
                setTimeout(() => bankrollEl.classList.remove('win-flash'), 1000);
            }

            updateDisplay();
            isSpinning = false;
            document.getElementById('spin-btn').disabled = false;
        }

        initGrid();
    </script>
</body>
</html>
