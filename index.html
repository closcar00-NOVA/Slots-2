<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian Fusion Vegas Slots</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;600;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --neon-red: #ff003c;
            --neon-gold: #ffcf00;
            --neon-green: #00ff66;
            --neon-blue: #00ccff;
            --bg-dark: #0a0a0a;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            position: relative;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-dark);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--neon-gold);
            font-weight: 800;
            font-size: 2rem;
            text-shadow: 0 0 20px var(--neon-gold);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 207, 0, 0.3);
            border-top-color: var(--neon-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Sound Toggle */
        .sound-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 15px;
            font-size: 0.9rem;
            border-color: var(--neon-gold);
            color: var(--neon-gold);
            box-shadow: 0 0 5px var(--neon-gold) inset, 0 0 5px var(--neon-gold);
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            transition: all 0.3s;
        }

        /* Top Pots */
        .pots-container {
            width: 835px;
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .pot {
            flex: 1;
            text-align: center;
            padding: 12px 10px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 10px var(--neon-red), inset 0 0 10px var(--neon-red);
            border: 1px solid var(--neon-red);
            transition: box-shadow 0.3s, transform 0.3s;
        }

        .pot h2 {
            margin: 0;
            font-weight: 100;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #fff;
        }

        .pot .amount {
            font-weight: 600;
            font-size: 1.4rem;
            color: var(--neon-gold);
            margin-top: 5px;
            text-shadow: 0 0 5px var(--neon-gold);
            transition: color 0.3s;
        }

        .pot.jackpot-win {
            box-shadow: 0 0 30px var(--neon-green), inset 0 0 20px var(--neon-green) !important;
            border-color: var(--neon-green) !important;
            transform: scale(1.1);
        }
        
        .pot.jackpot-win h2, .pot.jackpot-win .amount {
            color: var(--neon-green) !important;
            text-shadow: 0 0 10px var(--neon-green) !important;
        }

        #bonus-status-container {
            box-shadow: 0 0 10px var(--neon-blue), inset 0 0 10px var(--neon-blue);
            border-color: var(--neon-blue);
        }
        
        #bonus-status-container .amount {
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
        }

        #bonus-status-container.jackpot-win {
            box-shadow: 0 0 30px var(--neon-blue), inset 0 0 20px var(--neon-blue) !important;
            transform: scale(1.1);
        }

        /* Slot Machine & Lever Wrapper */
        .machine-wrapper {
            display: flex;
            align-items: center;
            gap: 15px; 
        }

        /* Slot Grid */
        .slot-machine {
            background-image: url('env_reel_backing.png.png');
            background-size: cover;
            background-position: center;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 15px var(--neon-gold), inset 0 0 20px var(--neon-gold);
            border: 2px solid var(--neon-gold);
            display: flex;
            gap: 10px;
            cursor: pointer;
            position: relative;
        }

        .reel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .symbol-box {
            width: 140px; 
            height: 100px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .symbol-img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            transition: transform 0.1s;
        }

        .coin-value {
            position: absolute;
            font-weight: 600;
            font-size: 1.4rem;
            color: var(--neon-gold);
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 10px var(--neon-gold);
            z-index: 10;
        }
        
        .coin-value.jackpot-text {
            color: var(--neon-red);
            font-size: 1.6rem;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 15px var(--neon-red);
            letter-spacing: 1px;
        }

        .win-line {
            box-shadow: 0 0 20px 5px var(--neon-gold) inset !important;
            border-color: var(--neon-gold) !important;
            background-color: rgba(255, 207, 0, 0.2);
            transition: all 0.3s;
        }
        
        .bonus-line {
            box-shadow: 0 0 20px 5px var(--neon-blue) inset !important;
            border-color: var(--neon-blue) !important;
            background-color: rgba(0, 204, 255, 0.2);
        }

        /* Dynamic Payline Multiplier Badge */
        .payline-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: var(--neon-red);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 800;
            z-index: 20;
            box-shadow: 0 0 10px #000, 0 0 10px var(--neon-red);
            border: 1px solid #fff;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Lever Assembly */
        .lever-container {
            width: 40px;
            height: 200px;
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        .lever-base {
            width: 30px;
            height: 80px;
            background: #222;
            border-radius: 5px;
            border: 1px solid #555;
            box-shadow: inset 0 0 10px #000;
            position: absolute;
            bottom: 0;
        }

        .lever-stick {
            width: 12px;
            height: 120px;
            background: linear-gradient(90deg, #999, #eee, #999);
            position: absolute;
            bottom: 60px;
            transform-origin: bottom center;
            transition: transform 0.3s ease-in-out;
            border-radius: 6px;
        }

        .lever-knob {
            width: 36px;
            height: 36px;
            background: radial-gradient(circle at 10px 10px, #ff4d6d, var(--neon-red));
            border-radius: 50%;
            position: absolute;
            top: -15px;
            left: -12px;
            box-shadow: 0 0 10px var(--neon-red);
        }

        .lever-container.pull .lever-stick {
            transform: rotateX(70deg) scaleY(0.6);
        }

        /* Controls */
        .controls {
            width: 835px;
            box-sizing: border-box;
            margin-top: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            font-weight: 100;
            font-size: 0.75rem;
            color: #aaa;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .stat-value {
            font-weight: 600;
            font-size: 1.25rem;
            color: #fff;
            transition: color 0.3s;
            white-space: nowrap;
        }

        .bet-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .adj-btn {
            background: transparent;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            width: 45px;
            height: 45px;
            border: 1px solid var(--neon-red);
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 8px var(--neon-red) inset, 0 0 8px var(--neon-red);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .adj-btn:hover:not(:disabled) {
            background: rgba(255, 0, 60, 0.2);
            box-shadow: 0 0 15px var(--neon-red) inset, 0 0 15px var(--neon-red);
        }

        .adj-btn:active:not(:disabled) {
            transform: scale(0.9);
        }

        .adj-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #555;
            box-shadow: none;
        }

        .win-flash {
            color: var(--neon-green) !important;
            text-shadow: 0 0 15px var(--neon-green);
            transform: scale(1.1);
        }

        button.control-btn {
            background: transparent;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            padding: 12px 20px;
            border: 1px solid var(--neon-red);
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 8px var(--neon-red) inset, 0 0 8px var(--neon-red);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        button.control-btn:hover:not(:disabled) {
            background: rgba(255, 0, 60, 0.2);
            box-shadow: 0 0 15px var(--neon-red) inset, 0 0 15px var(--neon-red);
        }

        button.control-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        button.control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            border-color: #555;
        }

        .multi-btn {
            border-color: #00ccff !important;
            box-shadow: 0 0 8px #00ccff inset, 0 0 8px #00ccff !important;
            min-width: 65px; 
            text-align: center;
        }

        .multi-btn:hover:not(:disabled) {
            background: rgba(0, 204, 255, 0.2) !important;
            box-shadow: 0 0 15px #00ccff inset, 0 0 15px #00ccff !important;
        }

        .multi-btn.active-x5 {
            border-color: #ff00ff !important;
            box-shadow: 0 0 12px #ff00ff inset, 0 0 12px #ff00ff !important;
            text-shadow: 0 0 5px #ff00ff;
        }

        .multi-btn.active-x10 {
            border-color: var(--neon-gold) !important;
            box-shadow: 0 0 12px var(--neon-gold) inset, 0 0 12px var(--neon-gold) !important;
            text-shadow: 0 0 5px var(--neon-gold);
        }

        .spin-btn {
            border-color: var(--neon-gold) !important;
            box-shadow: 0 0 10px var(--neon-gold) inset, 0 0 10px var(--neon-gold) !important;
            font-size: 1.2rem !important;
            padding: 12px 40px !important;
        }

        .spin-btn:hover:not(:disabled) {
            background: rgba(255, 207, 0, 0.2) !important;
            box-shadow: 0 0 20px var(--neon-gold) inset, 0 0 20px var(--neon-gold) !important;
        }
        
        .spinning .symbol-img {
            animation: blurSpin 0.1s infinite;
        }

        @keyframes blurSpin {
            0% { transform: translateY(-50%) scaleY(1.5); opacity: 0.5; }
            100% { transform: translateY(50%) scaleY(1.5); opacity: 0.5; }
        }

        /* BONUS WHEEL MODAL */
        .bonus-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }

        .bonus-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .wheel-container {
            position: relative;
            width: 550px; 
            height: 550px;
        }

        .wheel-pointer {
            position: absolute;
            top: -25px; 
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 50px solid var(--neon-blue);
            z-index: 15;
            filter: drop-shadow(0 0 15px var(--neon-blue));
        }

        .wheel {
            width: 100%; 
            height: 100%;
            border-radius: 50%;
            border: 10px solid #222;
            box-shadow: 0 0 40px var(--neon-blue), inset 0 0 40px #000;
            background: conic-gradient(
                #111 0deg 45deg,
                var(--neon-red) 45deg 90deg,
                #111 90deg 135deg,
                var(--neon-red) 135deg 180deg,
                #111 180deg 225deg,
                var(--neon-red) 225deg 270deg,
                var(--neon-gold) 270deg 315deg,
                var(--neon-red) 315deg 360deg
            );
            position: relative;
            overflow: hidden;
            transform: rotate(0deg);
        }

        /* Updated Radial Spoke Layout for Labels */
        .wheel-label {
            position: absolute;
            top: 50%; 
            left: 50%;
            width: 45%; 
            height: 40px; 
            margin-top: -20px; 
            transform-origin: 0% 50%; 
            text-align: right; 
            padding-right: 25px; 
            box-sizing: border-box;
            font-weight: 800;
            font-size: 1.3rem;
            color: #fff;
            text-shadow: 2px 2px 4px #000, -2px -2px 4px #000, 0 0 10px #000;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            white-space: nowrap;
        }

        .wheel-spin-btn {
            position: absolute;
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px; 
            height: 130px;
            border-radius: 50%;
            background: var(--bg-dark);
            border: 4px solid var(--neon-blue);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 0 25px var(--neon-blue) inset, 0 0 25px var(--neon-blue);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 10px var(--neon-blue);
            transition: all 0.2s;
        }

        .wheel-spin-btn:hover:not(:disabled) {
            transform: translate(-50%, -50%) scale(1.05);
            background: rgba(0, 204, 255, 0.2);
            box-shadow: 0 0 40px var(--neon-blue) inset, 0 0 40px var(--neon-blue);
        }
        
        .wheel-spin-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .wheel-win-display {
            position: absolute;
            bottom: -80px;
            width: 100%;
            text-align: center;
            font-size: 3rem;
            font-weight: 800;
            color: var(--neon-gold);
            text-shadow: 0 0 20px var(--neon-gold), 2px 2px 0 #000;
            opacity: 0;
            transition: opacity 0.5s, transform 0.5s;
            transform: translateY(20px);
        }
        .wheel-win-display.show {
            opacity: 1;
            transform: translateY(0);
        }

    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
        CONNECTING TO SERVER...
    </div>

    <button id="sound-toggle" class="sound-toggle" onclick="toggleSound()">🔊 Sound: ON</button>

    <!-- Full Screen Bonus Modal -->
    <div id="bonus-modal" class="bonus-modal">
        <div class="wheel-container">
            <div class="wheel-pointer"></div>
            <div id="wheel" class="wheel">
                <!-- Dynamically Generated Labels -->
            </div>
            <button id="wheel-spin-btn" class="wheel-spin-btn" onclick="spinBonusWheel()">SPIN</button>
            <div id="wheel-win-display" class="wheel-win-display">$0.00</div>
        </div>
    </div>

    <div class="pots-container">
        <div class="pot" id="grand-container">
            <h2>GRAND</h2>
            <div class="amount" id="grand-pot">$5,000.00</div>
        </div>
        <div class="pot" id="major-container">
            <h2>MAJOR</h2>
            <div class="amount" id="major-pot">$1,000.00</div>
        </div>
        <div class="pot" id="minor-container">
            <h2>MINOR</h2>
            <div class="amount" id="minor-pot">$250.00</div>
        </div>
        <div class="pot" id="bonus-status-container">
            <h2>BONUS</h2>
            <div class="amount">WHEEL</div>
        </div>
    </div>

    <div class="machine-wrapper">
        <div class="slot-machine" id="grid" onclick="spin()">
            <!-- Grid generated by JS -->
        </div>
        
        <div class="lever-container" id="lever" onclick="spin()">
            <div class="lever-base"></div>
            <div class="lever-stick">
                <div class="lever-knob"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="stat-box">
            <div class="stat-label">BANKROLL</div>
            <div class="stat-value" id="bankroll-display">$0</div>
        </div>
        
        <div class="bet-group">
            <button class="adj-btn" id="btn-minus">-</button>
            <div class="stat-box">
                <div class="stat-label">TOTAL BET</div>
                <div class="stat-value" id="bet-display">$10.00</div>
            </div>
            <button class="adj-btn" id="btn-plus">+</button>
        </div>

        <button class="control-btn multi-btn" id="multiplier-btn" onclick="toggleMultiplier()">x1</button>

        <div class="stat-box">
            <div class="stat-label">LAST WIN</div>
            <div class="stat-value" id="win-display">$0.00</div>
        </div>

        <button class="control-btn spin-btn" id="spin-btn" onclick="spin()">SPIN</button>
    </div>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIGURATION
        // ==========================================
        
        // PASTE YOUR CONFIG OBJECT HERE
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "vegas-pro-6256c.firebaseapp.com",
            projectId: "vegas-pro-6256c",
            storageBucket: "vegas-pro-6256c.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        const saveDocRef = db.collection('saves').doc('CHRIS123');

        // Game State
        let bankroll = 0; 
        let baseBet = 10;
        let winMultiplier = 1;
        const MAX_BET = 10000;
        const MIN_BET = 10;
        let isSpinning = false;
        let inBonusMode = false;

        function syncBankroll() {
            saveDocRef.update({
                bankroll: bankroll
            }).catch((error) => {
                console.error("Error syncing to Firestore:", error);
            });
        }

        saveDocRef.onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                if (data.bankroll !== undefined) {
                    bankroll = data.bankroll;
                }
            } else {
                bankroll = 10000; 
                saveDocRef.set({ bankroll: bankroll }, { merge: true });
            }
            
            updateDisplay();
            document.getElementById('loading-screen').style.display = 'none';
        }, (error) => {
            console.error("Firestore connection error:", error);
            document.getElementById('loading-screen').innerText = "CONNECTION ERROR";
        });

        // ==========================================
        // 2. AUDIO LOGIC
        // ==========================================
        
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let soundEnabled = true;

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('sound-toggle');
            if (soundEnabled) {
                btn.innerText = "🔊 Sound: ON";
                btn.style.borderColor = "var(--neon-gold)";
                btn.style.color = "var(--neon-gold)";
                btn.style.boxShadow = "0 0 5px var(--neon-gold) inset, 0 0 5px var(--neon-gold)";
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            } else {
                btn.innerText = "🔇 Sound: OFF";
                btn.style.borderColor = "#555";
                btn.style.color = "#888";
                btn.style.boxShadow = "none";
            }
        }

        function playWinSound() {
            if (!soundEnabled) return;
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.type = 'sine'; 
            
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            osc.frequency.setValueAtTime(783.99, now + 0.2);
            osc.frequency.setValueAtTime(1046.50, now + 0.3);
            
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05);
            gainNode.gain.setValueAtTime(0.3, now + 0.4);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
            
            osc.start(now);
            osc.stop(now + 1);
        }

        function playBigWinSound() {
            if (!soundEnabled) return;
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.type = 'square'; 
            
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(440, now); 
            osc.frequency.setValueAtTime(554.37, now + 0.15); 
            osc.frequency.setValueAtTime(659.25, now + 0.3); 
            osc.frequency.setValueAtTime(880, now + 0.45); 
            
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.2, now + 0.1);
            gainNode.gain.setValueAtTime(0.2, now + 1.5);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 2.5);
            
            osc.start(now);
            osc.stop(now + 3);
        }

        // ==========================================
        // 3. WEIGHTED RNG LOGIC
        // ==========================================
        
        let gridData = [[], [], [], [], []];

        const SYMBOL_WEIGHTS = [
            { id: 'symbol_a.png.png', weight: 40 },
            { id: 'symbol_k.png.png', weight: 40 },
            { id: 'symbol_q.png.png', weight: 35 },
            { id: 'symbol_j.png.png', weight: 35 },
            { id: 'symbol_pepper.png.png', weight: 20 },
            { id: 'symbol_sycee.png.png', weight: 15 },
            { id: 'symbol_wild.png.png', weight: 10 },
            { id: 'symbol_coin.png.png', weight: 6 },
            { id: 'symbol_bonus.png.png', weight: 2 } 
        ];

        function getRandomSymbol() {
            const totalWeight = SYMBOL_WEIGHTS.reduce((sum, sym) => sum + sym.weight, 0);
            let rand = Math.random() * totalWeight;
            for (let sym of SYMBOL_WEIGHTS) {
                if (rand < sym.weight) return sym.id;
                rand -= sym.weight;
            }
            return SYMBOL_WEIGHTS[0].id; 
        }

        const PAYTABLE = {
            'symbol_wild.png.png': { 3: 5, 4: 20, 5: 100 },
            'symbol_sycee.png.png': { 3: 4, 4: 15, 5: 50 },
            'symbol_pepper.png.png': { 3: 3, 4: 10, 5: 30 },
            'symbol_a.png.png': { 3: 1, 4: 3, 5: 10 },
            'symbol_k.png.png': { 3: 1, 4: 3, 5: 10 },
            'symbol_q.png.png': { 3: 0.5, 4: 2, 5: 5 },
            'symbol_j.png.png': { 3: 0.5, 4: 2, 5: 5 }
        };

        const formatMoney = (amount) => {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(amount);
        };

        const gridEl = document.getElementById('grid');
        const cols = 5;
        const rows = 3;

        function initGrid() {
            gridEl.innerHTML = '';
            for (let c = 0; c < cols; c++) {
                const reel = document.createElement('div');
                reel.className = 'reel';
                reel.id = `reel-${c}`;
                
                for (let r = 0; r < rows; r++) {
                    const box = document.createElement('div');
                    box.className = 'symbol-box';
                    box.id = `box-${c}-${r}`;
                    
                    const img = document.createElement('img');
                    img.className = 'symbol-img';
                    img.src = 'symbol_wild.png.png';
                    img.onerror = function() { this.style.display = 'none'; }; 
                    
                    box.appendChild(img);
                    reel.appendChild(box);
                }
                gridEl.appendChild(reel);
            }
            updateDisplay();
        }

        function updateDisplay() {
            const totalBetCost = baseBet * winMultiplier;
            document.getElementById('bankroll-display').innerText = formatMoney(bankroll);
            document.getElementById('bet-display').innerText = formatMoney(totalBetCost);
            
            document.getElementById('minor-pot').innerText = formatMoney(totalBetCost * 25);
            document.getElementById('major-pot').innerText = formatMoney(totalBetCost * 100);
            document.getElementById('grand-pot').innerText = formatMoney(totalBetCost * 500);
        }

        // ==========================================
        // 4. CONTROLS
        // ==========================================

        let betInterval;
        let speed = 200;

        function alterBet(direction) {
            if (isSpinning || inBonusMode) return;
            if (direction === 'up') {
                if (baseBet < 100) baseBet += 10;
                else if (baseBet < 1000) baseBet += 100;
                else if (baseBet < MAX_BET) baseBet += 1000;
            } else {
                if (baseBet > 1000) baseBet -= 1000;
                else if (baseBet > 100) baseBet -= 100;
                else if (baseBet > MIN_BET) baseBet -= 10;
            }
            
            if (baseBet * winMultiplier > bankroll) {
                baseBet = Math.max(MIN_BET, Math.floor(bankroll / winMultiplier));
            }
            updateDisplay();
        }

        function startAdjusting(direction) {
            if (isSpinning || inBonusMode) return;
            alterBet(direction); 
            speed = 200;
            betInterval = setTimeout(function tick() {
                alterBet(direction);
                speed = Math.max(50, speed - 20); 
                betInterval = setTimeout(tick, speed);
            }, 500); 
        }

        function stopAdjusting() {
            clearTimeout(betInterval);
        }

        const btnPlus = document.getElementById('btn-plus');
        const btnMinus = document.getElementById('btn-minus');

        btnPlus.addEventListener('mousedown', () => startAdjusting('up'));
        btnPlus.addEventListener('mouseup', stopAdjusting);
        btnPlus.addEventListener('mouseleave', stopAdjusting);
        btnPlus.addEventListener('touchstart', (e) => { e.preventDefault(); startAdjusting('up'); });
        btnPlus.addEventListener('touchend', stopAdjusting);

        btnMinus.addEventListener('mousedown', () => startAdjusting('down'));
        btnMinus.addEventListener('mouseup', stopAdjusting);
        btnMinus.addEventListener('mouseleave', stopAdjusting);
        btnMinus.addEventListener('touchstart', (e) => { e.preventDefault(); startAdjusting('down'); });
        btnMinus.addEventListener('touchend', stopAdjusting);


        function toggleMultiplier() {
            if (isSpinning || inBonusMode) return;
            const btn = document.getElementById('multiplier-btn');
            btn.classList.remove('active-x5', 'active-x10');

            if (winMultiplier === 1) {
                winMultiplier = 5;
                btn.classList.add('active-x5');
            } else if (winMultiplier === 5) {
                winMultiplier = 10;
                btn.classList.add('active-x10');
            } else {
                winMultiplier = 1;
            }

            btn.innerText = `x${winMultiplier}`;
            
            if (baseBet * winMultiplier > bankroll) {
                baseBet = Math.max(MIN_BET, Math.floor(bankroll / winMultiplier));
            }
            updateDisplay();
        }

        function spin() {
            if (soundEnabled && !audioCtx) audioCtx = new AudioContext();
            
            const totalBetCost = baseBet * winMultiplier;
            if (isSpinning || inBonusMode || totalBetCost > bankroll || bankroll <= 0) return;
            
            isSpinning = true;
            bankroll -= totalBetCost;
            syncBankroll(); 
            
            const winDisplayEl = document.getElementById('win-display');
            winDisplayEl.innerText = "$0";
            winDisplayEl.classList.remove('win-flash');
            
            document.querySelectorAll('.pot').forEach(pot => pot.classList.remove('jackpot-win'));
            
            updateDisplay();
            
            document.querySelectorAll('.symbol-box').forEach(b => {
                b.classList.remove('win-line', 'bonus-line');
                const badge = b.querySelector('.payline-badge');
                if (badge) badge.remove();
                b.dataset.jackpotType = ""; 
            });
            
            const lever = document.getElementById('lever');
            lever.classList.add('pull');
            setTimeout(() => lever.classList.remove('pull'), 400);

            const btn = document.getElementById('spin-btn');
            btn.disabled = true;

            const reels = document.querySelectorAll('.reel');
            
            reels.forEach((reel, colIndex) => {
                const boxes = reel.querySelectorAll('.symbol-box');
                
                boxes.forEach(box => {
                    box.classList.add('spinning');
                    const oldVal = box.querySelector('.coin-value');
                    if (oldVal) oldVal.remove();
                });

                setTimeout(() => {
                    boxes.forEach((box, rowIndex) => {
                        box.classList.remove('spinning');
                        
                        // USING NEW WEIGHTED RNG HERE
                        const randomImg = getRandomSymbol();
                        gridData[colIndex][rowIndex] = randomImg; 
                        
                        const imgEl = box.querySelector('.symbol-img');
                        imgEl.src = randomImg;
                        imgEl.style.display = 'block';

                        if (randomImg === 'symbol_coin.png.png') {
                            const valEl = document.createElement('div');
                            valEl.className = 'coin-value';
                            
                            const jackpotRoll = Math.random();
                            let cashValue = 0;
                            let label = "";

                            if (jackpotRoll > 0.99) {
                                label = "GRAND";
                                cashValue = totalBetCost * 500;
                            } else if (jackpotRoll > 0.96) {
                                label = "MAJOR";
                                cashValue = totalBetCost * 100;
                            } else if (jackpotRoll > 0.90) {
                                label = "MINOR";
                                cashValue = totalBetCost * 25;
                            } else {
                                const multi = [0.5, 1, 2, 5, 10][Math.floor(Math.random() * 5)];
                                cashValue = totalBetCost * multi;
                                label = formatMoney(cashValue);
                            }

                            if (label === "GRAND" || label === "MAJOR" || label === "MINOR") {
                                valEl.classList.add('jackpot-text');
                                box.dataset.jackpotType = label.toLowerCase();
                            }

                            valEl.innerText = label;
                            box.dataset.cash = cashValue; 
                            box.appendChild(valEl);
                        } else {
                            box.dataset.cash = 0;
                        }
                    });

                    if (colIndex === reels.length - 1) {
                        setTimeout(evaluateBoard, 300); 
                    }
                }, 500 + (colIndex * 300));
            });
        }

        // ==========================================
        // 5. BONUS WHEEL
        // ==========================================
        
        const wheelMultipliers = [25, 200, 50, 100, 75, 250, 1000, 500];

        function triggerBonusModal(totalBetCost) {
            inBonusMode = true;
            document.getElementById('bonus-modal').classList.add('active');
            
            const wheel = document.getElementById('wheel');
            wheel.innerHTML = ''; 
            wheel.style.transition = 'none';
            wheel.style.transform = 'rotate(0deg)';
            
            document.getElementById('wheel-win-display').classList.remove('show');
            document.getElementById('wheel-spin-btn').disabled = false;
            
            wheelMultipliers.forEach((multi, i) => {
                const label = document.createElement('div');
                label.className = 'wheel-label';
                
                // Rotates text outward along the spoke line
                label.style.transform = `rotate(${i * 45 - 67.5}deg)`;
                label.innerText = formatMoney(totalBetCost * multi);
                
                if (i === 6) {
                    label.style.color = "var(--neon-gold)";
                    label.style.textShadow = "2px 2px 4px #000, 0 0 15px var(--neon-gold)";
                }
                
                wheel.appendChild(label);
            });
        }

        function spinBonusWheel() {
            if (soundEnabled && !audioCtx) audioCtx = new AudioContext();
            const spinBtn = document.getElementById('wheel-spin-btn');
            spinBtn.disabled = true;
            
            const totalBetCost = baseBet * winMultiplier;
            const winningSlice = Math.floor(Math.random() * 8);
            
            const extraSpins = 6; 
            const targetAngle = 360 - (winningSlice * 45 + 22.5);
            const finalRotation = (360 * extraSpins) + targetAngle;
            
            const wheel = document.getElementById('wheel');
            wheel.style.transition = 'transform 4.5s cubic-bezier(0.15, 0.9, 0.25, 1)';
            wheel.style.transform = `rotate(${finalRotation}deg)`;
            
            setTimeout(() => {
                const wonAmount = totalBetCost * wheelMultipliers[winningSlice];
                bankroll += wonAmount;
                syncBankroll(); 
                
                playBigWinSound();
                
                const winDisplay = document.getElementById('wheel-win-display');
                winDisplay.innerText = formatMoney(wonAmount);
                winDisplay.classList.add('show');
                
                const bankrollEl = document.getElementById('bankroll-display');
                bankrollEl.classList.add('win-flash');
                setTimeout(() => bankrollEl.classList.remove('win-flash'), 1500);
                
                setTimeout(() => {
                    const winDisplayEl = document.getElementById('win-display');
                    const currentWin = parseFloat(winDisplayEl.innerText.replace(/[^0-9.-]+/g,"")) || 0;
                    winDisplayEl.innerText = formatMoney(currentWin + wonAmount);
                    winDisplayEl.classList.add('win-flash');
                    
                    updateDisplay();
                    document.getElementById('bonus-modal').classList.remove('active');
                    inBonusMode = false;
                    isSpinning = false;
                    document.getElementById('spin-btn').disabled = false;
                }, 3500); 
                
            }, 4600); 
        }

        function evaluateBoard() {
            let totalWin = 0;
            let triggeredWin = false;
            
            for (let row = 0; row < rows; row++) {
                let matchCount = 1;
                let firstSymbol = gridData[0][row];
                
                let targetSymbol = firstSymbol;
                if (targetSymbol === 'symbol_wild.png.png') {
                    for (let c = 1; c < cols; c++) {
                        if (gridData[c][row] !== 'symbol_wild.png.png' && 
                            gridData[c][row] !== 'symbol_coin.png.png' && 
                            gridData[c][row] !== 'symbol_bonus.png.png') {
                            targetSymbol = gridData[c][row];
                            break;
                        }
                    }
                }

                if (targetSymbol === 'symbol_coin.png.png' || targetSymbol === 'symbol_bonus.png.png') continue;

                let winningBoxes = [`box-0-${row}`];

                for (let col = 1; col < cols; col++) {
                    const currentSymbol = gridData[col][row];
                    if (currentSymbol === targetSymbol || currentSymbol === 'symbol_wild.png.png') {
                        matchCount++;
                        winningBoxes.push(`box-${col}-${row}`);
                    } else {
                        break; 
                    }
                }

                if (matchCount >= 3 && PAYTABLE[targetSymbol]) {
                    const multiplier = PAYTABLE[targetSymbol][matchCount];
                    totalWin += (baseBet * multiplier) * winMultiplier;
                    triggeredWin = true;
                    
                    winningBoxes.forEach(id => {
                        document.getElementById(id).classList.add('win-line');
                    });

                    const lastBoxId = winningBoxes[winningBoxes.length - 1];
                    const lastBoxEl = document.getElementById(lastBoxId);
                    
                    const badge = document.createElement('div');
                    badge.className = 'payline-badge';
                    badge.innerText = `Line x${multiplier}`;
                    lastBoxEl.appendChild(badge);
                }
            }

            let coinBoxes = [];
            let coinTotal = 0;
            for (let c = 0; c < cols; c++) {
                for (let r = 0; r < rows; r++) {
                    if (gridData[c][r] === 'symbol_coin.png.png') {
                        const box = document.getElementById(`box-${c}-${r}`);
                        coinBoxes.push(box);
                        coinTotal += parseFloat(box.dataset.cash);
                    }
                }
            }

            if (coinBoxes.length >= 3) {
                totalWin += coinTotal;
                triggeredWin = true;
                
                coinBoxes.forEach(box => {
                    box.classList.add('win-line');
                    const badge = document.createElement('div');
                    badge.className = 'payline-badge';
                    
                    if (box.dataset.jackpotType) {
                        document.getElementById(`${box.dataset.jackpotType}-container`).classList.add('jackpot-win');
                        badge.style.background = 'var(--neon-green)';
                        badge.style.color = '#000';
                        badge.innerText = `${box.dataset.jackpotType.toUpperCase()}!`;
                    } else {
                        badge.style.background = 'var(--neon-gold)';
                        badge.style.color = '#000';
                        badge.innerText = `CASH!`;
                    }
                    box.appendChild(badge);
                });
            }

            let bonusBoxes = [];
            for (let c = 0; c < cols; c++) {
                for (let r = 0; r < rows; r++) {
                    if (gridData[c][r] === 'symbol_bonus.png.png') {
                        bonusBoxes.push(document.getElementById(`box-${c}-${r}`));
                    }
                }
            }

            if (triggeredWin && totalWin > 0) {
                playWinSound();
                bankroll += totalWin;
                syncBankroll(); 
                
                const winDisplayEl = document.getElementById('win-display');
                winDisplayEl.innerText = formatMoney(totalWin);
                winDisplayEl.classList.add('win-flash');
                
                const bankrollEl = document.getElementById('bankroll-display');
                bankrollEl.classList.add('win-flash');
                setTimeout(() => bankrollEl.classList.remove('win-flash'), 1000);
            }

            updateDisplay();

            if (bonusBoxes.length >= 3) {
                bonusBoxes.forEach(box => {
                    box.classList.add('bonus-line');
                    const badge = document.createElement('div');
                    badge.className = 'payline-badge';
                    badge.style.background = 'var(--neon-blue)';
                    badge.style.color = '#000';
                    badge.innerText = `BONUS!`;
                    box.appendChild(badge);
                });
                
                document.getElementById('bonus-status-container').classList.add('jackpot-win');
                
                setTimeout(() => {
                    triggerBonusModal(baseBet * winMultiplier);
                    document.getElementById('bonus-status-container').classList.remove('jackpot-win');
                }, 1500);
            } else {
                isSpinning = false;
                document.getElementById('spin-btn').disabled = false;
            }
        }

        initGrid();
    </script>
</body>
</html>
